<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="W music" />
  <title>W music</title>
  <style>
    :root {
      --bg: #09090d;
      --surface: #13131b;
      --surface-2: #1c1c28;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --muted: #8e8ea0;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.35);
      --sc: #ff5500;
      --yt: #ff0033;
      --danger: #ff4d6d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 145px;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 13, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      max-width: 740px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #00d4ff);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-box {
      max-width: 740px;
      margin: 0 auto 10px;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 15px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .source-filters {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.28);
      background: var(--surface-2);
    }

    .dot-sc { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
    .dot-yt { width: 7px; height: 7px; border-radius: 50%; background: var(--yt); }

    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .status-bar {
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .error-banner {
      display: none;
      background: rgba(255, 77, 109, 0.14);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #ffb3c1;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .track-item.playing {
      border-color: var(--accent);
      background: rgba(124, 92, 255, 0.13);
    }

    .track-cover {
      width: 52px;
      height: 52px;
      border-radius: 11px;
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--muted);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #d4d4df;
    }

    .stat-badge.sc {
      background: rgba(255, 85, 0, 0.14);
      color: #ff9466;
      border: 1px solid rgba(255, 85, 0, 0.25);
    }

    .stat-badge.yt {
      background: rgba(255, 0, 51, 0.14);
      color: #ff7a93;
      border: 1px solid rgba(255, 0, 51, 0.25);
    }

    .stat-fresh {
      font-size: 11px;
      color: var(--muted);
    }

    .track-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .track-duration {
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      padding: 4px;
      cursor: pointer;
    }
    .fav-btn.active { color: var(--danger); }

    /* Bottom Player */
    .player-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(19, 19, 27, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .player-inner {
      max-width: 740px;
      margin: 0 auto;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .time-label {
      font-size: 11px;
      color: var(--muted);
      width: 34px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 99px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .now-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .now-meta { min-width: 0; }
    .now-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-artist {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 17px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .ctrl-btn.active { color: var(--accent); }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .empty-state {
      text-align: center;
      padding: 44px 16px;
      color: var(--muted);
      font-size: 14.5px;
    }

    .loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">W</div>
        <span>W music</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabSearch">Лента / Поиск</button>
        <button class="tab-btn" id="tabFav">Избранное (<span id="favCount">0</span>)</button>
      </div>
    </div>
    <form class="search-box" id="searchForm">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск треков и артистов..." autocomplete="off" />
      <button type="submit" class="search-btn">Найти</button>
    </form>
    <div class="source-filters">
      <button class="filter-chip active" data-source="all">Все площадки</button>
      <button class="filter-chip" data-source="soundcloud"><span class="dot-sc"></span>SoundCloud</button>
      <button class="filter-chip" data-source="youtube"><span class="dot-yt"></span>YouTube Music</button>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <span id="statusLabel">Подборка: популярное + свежее</span>
      <span>Переключение: после конца трека</span>
    </div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="track-list" id="trackList"></div>
  </main>

  <div class="player-bar">
    <div class="player-inner">
      <div class="progress-wrap">
        <span class="time-label" id="curTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
        <span class="time-label" id="durTime">0:00</span>
      </div>
      <div class="player-controls-row">
        <div class="now-playing">
          <div class="now-cover" id="nowCover">🎵</div>
          <div class="now-meta">
            <div class="now-title" id="nowTitle">Нажмите на любой трек</div>
            <div class="now-artist" id="nowArtist">W music • Звук готов</div>
          </div>
        </div>
        <div class="buttons">
          <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">🔀</button>
          <button class="ctrl-btn" id="prevBtn" title="Предыдущий">⏮</button>
          <button class="play-btn" id="playBtn" title="Пуск / Пауза">▶</button>
          <button class="ctrl-btn" id="nextBtn" title="Следующий">⏭</button>
          <button class="ctrl-btn active" id="repeatBtn" title="Повтор">🔁</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script>
    const SERVER_URL = "https://barrel-default-signatures-ict.trycloudflare.com";

    const audio = document.getElementById("audio");
    const trackListEl = document.getElementById("trackList");
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const statusLabel = document.getElementById("statusLabel");
    const errorBanner = document.getElementById("errorBanner");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const seekBar = document.getElementById("seekBar");
    const curTimeEl = document.getElementById("curTime");
    const durTimeEl = document.getElementById("durTime");
    const nowTitle = document.getElementById("nowTitle");
    const nowArtist = document.getElementById("nowArtist");
    const nowCover = document.getElementById("nowCover");
    const tabSearch = document.getElementById("tabSearch");
    const tabFav = document.getElementById("tabFav");
    const favCountEl = document.getElementById("favCount");

    let queue = [];
    let allTracks = [];
    let favorites = JSON.parse(localStorage.getItem("wmusic_favs") || "[]");
    let currentIndex = -1;
    let currentTab = "search";
    let sourceFilter = "all";
    let isShuffle = false;
    let repeatMode = "all"; // "all" | "one" | "none"
    let playRequestId = 0; // Защита от наложения и гонок запросов

    function showError(msg) {
      if (!msg) {
        errorBanner.style.display = "none";
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function updateFavCount() {
      favCountEl.textContent = favorites.length;
    }
    updateFavCount();

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function formatPlays(num) {
      const n = Number(num);
      if (!n || isNaN(n) || n <= 0) return "н/д";
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + " млн";
      if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, "") + " тыс.";
      return n.toLocaleString("ru-RU");
    }

    function formatFreshness(dateInput) {
      if (!dateInput) return "";
      const ts = new Date(dateInput).getTime();
      if (isNaN(ts)) return "";
      const days = Math.max(0, Math.floor((Date.now() - ts) / 86400000));
      if (days === 0) return "сегодня";
      if (days === 1) return "вчера";
      if (days < 30) return `${days} дн. назад`;
      if (days < 365) return `${Math.floor(days / 30)} мес. назад`;
      return `${Math.floor(days / 365)} г. назад`;
    }

    function detectSource(raw) {
      const s = String(raw.source || raw.platform || raw.provider || raw.url || "").toLowerCase();
      if (s.includes("youtube") || s.includes("youtu.be") || s.includes("yt")) return "youtube";
      return "soundcloud";
    }

    function normalizeTrack(raw) {
      const id = String(raw.id || raw.trackId || raw.videoId || raw.url || Math.random().toString(36).slice(2));
      const title = raw.title || raw.name || "Без названия";
      const artist = raw.artist || raw.author || raw.channelTitle || (raw.user && raw.user.username) || "Неизвестный артист";
      const artwork = raw.artwork || raw.cover || raw.thumbnail || (raw.user && raw.user.avatar_url) || "";
      const source = detectSource(raw);

      // Раздельная статистика для SoundCloud и YouTube Music
      const rawPlays = Number(raw.playback_count || raw.playCount || raw.plays || raw.views || raw.viewCount || 0);
      const scPlays = Number(raw.scPlays || (source === "soundcloud" ? rawPlays : 0));
      const ytPlays = Number(raw.ytPlays || (source === "youtube" ? rawPlays : 0));

      const createdAt = raw.created_at || raw.release_date || raw.publishedAt || raw.date || null;
      const timestamp = createdAt ? new Date(createdAt).getTime() || 0 : 0;

      let streamUrl = raw.streamUrl || raw.audioUrl || "";
      if (!streamUrl) {
        streamUrl = `${SERVER_URL}/api/stream/${encodeURIComponent(id)}?source=${source}`;
      } else if (streamUrl.startsWith("/")) {
        streamUrl = SERVER_URL + streamUrl;
      }

      const duration = raw.duration ? (raw.duration > 10000 ? raw.duration / 1000 : raw.duration) : 0;

      return {
        id,
        title,
        artist,
        artwork,
        source,
        scPlays,
        ytPlays,
        totalPlays: scPlays + ytPlays,
        createdAt,
        timestamp,
        streamUrl,
        duration
      };
    }

    // Ранжирование: баланс популярности и свежести + чередование разных артистов
    function rankAndDiversify(tracks) {
      const now = Date.now();
      const scored = tracks.map(t => {
        const popularityScore = Math.log10((t.totalPlays || 10) + 10);
        const ageDays = t.timestamp ? Math.max(1, (now - t.timestamp) / 86400000) : 180;
        const freshnessScore = 10 / Math.sqrt(ageDays);
        return { track: t, score: popularityScore * 1.4 + freshnessScore };
      });

      scored.sort((a, b) => b.score - a.score);

      // Разводим треки одного и того же артиста, чтобы в ленте были разные исполнители
      const result = [];
      const pool = scored.map(s => s.track);
      while (pool.length > 0) {
        const lastArtist = result.length ? result[result.length - 1].artist.toLowerCase() : "";
        let pickIdx = pool.findIndex(t => t.artist.toLowerCase() !== lastArtist);
        if (pickIdx === -1) pickIdx = 0;
        result.push(pool.splice(pickIdx, 1)[0]);
      }
      return result;
    }

    async function fetchFromServer(query) {
      const urls = [
        `${SERVER_URL}/api/search?q=${encodeURIComponent(query)}&limit=25`,
        `${SERVER_URL}/search?q=${encodeURIComponent(query)}`
      ];
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (res.ok) {
            const json = await res.json();
            const arr = Array.isArray(json) ? json : (json.tracks || json.results || json.items || []);
            if (arr.length) return arr.map(normalizeTrack);
          }
        } catch (_) {}
      }
      return [];
    }

    // Загрузка микса разных артистов (популярное + свежее)
    async function loadFeedOrSearch(customQuery = "") {
      showError("");
      if (customQuery) {
        statusLabel.innerHTML = `<span class="loader"></span>Ищем «${escapeHtml(customQuery)}»...`;
        const found = await fetchFromServer(customQuery);
        allTracks = rankAndDiversify(found);
        statusLabel.textContent = allTracks.length
          ? `Найдено: ${allTracks.length} (популярность + свежесть)`
          : "Ничего не найдено";
      } else {
        statusLabel.innerHTML = `<span class="loader"></span>Собираем свежие хиты разных артистов...`;
        const queries = ["2026 hits", "new music", "top tracks", "phonk", "hip hop"];
        const batches = await Promise.all(queries.map(q => fetchFromServer(q)));
        const map = new Map();
        batches.flat().forEach(t => {
          const key = `${t.artist.toLowerCase()}-${t.title.toLowerCase()}`;
          if (!map.has(key)) {
            map.set(key, t);
          } else {
            // Если трек есть  и на SoundCloud, и на YouTube — объединяем статистику
            const existing = map.get(key);
            existing.scPlays = Math.max(existing.scPlays, t.scPlays);
            existing.ytPlays = Math.max(existing.ytPlays, t.ytPlays);
            existing.totalPlays = existing.scPlays + existing.ytPlays;
          }
        });
        allTracks = rankAndDiversify(Array.from(map.values()));
        statusLabel.textContent = allTracks.length
          ? `Рекомендации: ${allTracks.length} треков разных артистов`
          : "Сервер не вернул треки — проверь поиск";
      }
      renderTracks();
    }

    function getFilteredList() {
      const base = currentTab === "search" ? allTracks : favorites;
      if (sourceFilter === "all") return base;
      return base.filter(t => {
        if (sourceFilter === "soundcloud") return t.source === "soundcloud" || t.scPlays > 0;
        if (sourceFilter === "youtube") return t.source === "youtube" || t.ytPlays > 0;
        return true;
      });
    }

    function isFavorite(id) {
      return favorites.some(t => t.id === id);
    }

    function toggleFavorite(track, e) {
      e.stopPropagation();
      if (isFavorite(track.id)) {
        favorites = favorites.filter(t => t.id !== track.id);
      } else {
        favorites.unshift(track);
      }
      localStorage.setItem("wmusic_favs", JSON.stringify(favorites));
      updateFavCount();
      renderTracks();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function renderTracks() {
      const list = getFilteredList();
      if (!list.length) {
        trackListEl.innerHTML = `<div class="empty-state">${
          currentTab === "search"
            ? "По выбранному фильтру треков нет. Введите запрос в поиск сверху."
            : "В избранном пока пусто. Нажмите ♡ справа от трека."
        }</div>`;
        return;
      }

      const activeTrack = queue[currentIndex];
      trackListEl.innerHTML = "";

      list.forEach((track, idx) => {
        const isPlaying = activeTrack && activeTrack.id === track.id;
        const freshText = formatFreshness(track.createdAt);

        let statsHtml = "";
        if (track.scPlays > 0 || track.source === "soundcloud") {
          statsHtml += `<span class="stat-badge sc">☁ SoundCloud: ${formatPlays(track.scPlays)}</span>`;
        }
        if (track.ytPlays > 0 || track.source === "youtube") {
          statsHtml += `<span class="stat-badge yt">▶ YouTube Music: ${formatPlays(track.ytPlays)}</span>`;
        }
        if (freshText) {
          statsHtml += `<span class="stat-fresh">• ${freshText}</span>`;
        }

        const item = document.createElement("div");
        item.className = "track-item" + (isPlaying ? " playing" : "");
        item.innerHTML = `
          ${track.artwork
            ? `<img class="track-cover" src="${track.artwork}" alt="" loading="lazy" />`
            : `<div class="track-cover">🎵</div>`}
          <div class="track-info">
            <div class="track-title">${escapeHtml(track.title)}</div>
            <div class="track-artist">${escapeHtml(track.artist)}</div>
            <div class="track-stats">${statsHtml}</div>
          </div>
          <div class="track-right">
            <button class="fav-btn ${isFavorite(track.id) ? "active" : ""}" title="В избранное">
              ${isFavorite(track.id) ? "♥" : "♡"}
            </button>
            ${track.duration ? `<span class="track-duration">${formatTime(track.duration)}</span>` : ""}
          </div>
        `;

        item.querySelector(".fav-btn").addEventListener("click", (e) => toggleFavorite(track, e));
        item.addEventListener("click", () => {
          queue = [...list];
          playTrackAt(idx);
        });

        trackListEl.appendChild(item);
      });
    }

    async function resolveAudioUrl(streamUrl) {
      try {
        const probe = await fetch(streamUrl, { method: "GET" });
        const contentType = probe.headers.get("content-type") || "";
        if (contentType.includes("application/json")) {
          const data = await probe.json();
          return data.url || data.streamUrl || data.audioUrl || streamUrl;
        }
        return probe.url || streamUrl;
      } catch (_) {
        return streamUrl;
      }
    }

    async function playTrackAt(index) {
      if (index < 0 || index >= queue.length) return;
      const reqId = ++playRequestId;
      currentIndex = index;
      const track = queue[currentIndex];

      showError("");
      nowTitle.textContent = track.title;
      nowArtist.textContent = `${track.artist} • Загрузка звука...`;
      nowCover.innerHTML = track.artwork
        ? `<img src="${track.artwork}" style="width:100%;height:100%;border-radius:10px;object-fit:cover;" />`
        : "🎵";
      renderTracks();

      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      const playableUrl = await resolveAudioUrl(track.streamUrl);
      if (reqId !== playRequestId) return;

      audio.src = playableUrl;
      audio.volume = 1.0;

      try {
        await audio.play();
        if (reqId !== playRequestId) return;
        playBtn.textContent = "⏸";
        const platformName = track.source === "youtube" ? "YouTube Music" : "SoundCloud";
        nowArtist.textContent = `${track.artist} • ${platformName}`;
        updateMediaSession(track);
      } catch (err) {
        if (reqId !== playRequestId) return;
        playBtn.textContent = "▶";
        nowArtist.textContent = track.artist;
        if (err.name === "NotAllowedError") {
          showError("Нажмите кнопку ▶ на плеере внизу, чтобы браузер разрешил воспроизведение звука.");
        } else {
          showError(`Не удалось загрузить аудиопоток для «${track.title}». Попробуйте другой трек или нажмите ⏭.`);
        }
      }
    }

    function playNext(fromEndedEvent = false) {
      if (!queue.length) return;
      if (fromEndedEvent && repeatMode === "one") {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        return;
      }
      if (isShuffle && queue.length > 1) {
        let nextIdx;
        do {
          nextIdx = Math.floor(Math.random() * queue.length);
        } while (nextIdx === currentIndex);
        playTrackAt(nextIdx);
        return;
      }
      if (currentIndex + 1 < queue.length) {
        playTrackAt(currentIndex + 1);
      } else if (repeatMode === "all" || !fromEndedEvent) {
        playTrackAt(0);
      } else {
        playBtn.textContent = "▶";
      }
    }

    function playPrev() {
      if (!queue.length) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      const prevIdx = currentIndex - 1 >= 0 ? currentIndex - 1 : queue.length - 1;
      playTrackAt(prevIdx);
    }

    function updateMediaSession(track) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "W music",
          artwork: track.artwork ? [{ src: track.artwork, sizes: "512x512", type: "image/jpeg" }] : []
        });
        navigator.mediaSession.setActionHandler("play", () => { audio.play(); playBtn.textContent = "⏸"; });
        navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); playBtn.textContent = "▶"; });
        navigator.mediaSession.setActionHandler("previoustrack", playPrev);
        navigator.mediaSession.setActionHandler("nexttrack", () => playNext(false));
      }
    }

    audio.addEventListener("ended", () => {
      if (audio.duration && audio.duration > 1) {
        playNext(true);
      }
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration && !isNaN(audio.duration)) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        curTimeEl.textContent = formatTime(audio.currentTime);
        durTimeEl.textContent = formatTime(audio.duration);
      }
    });

    seekBar.addEventListener("input", () => {
      if (audio.duration && !isNaN(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    playBtn.addEventListener("click", async () => {
      if (!audio.src) {
        const list = getFilteredList();
        if (list.length) {
          queue = [...list];
          playTrackAt(0);
        }
        return;
      }
      if (audio.paused) {
        try {
          await audio.play();
          playBtn.textContent = "⏸";
          showError("");
        } catch (e) {
          showError("Браузер заблокировал звук — проверьте громкость или выберите другой трек.");
        }
      } else {
        audio.pause();
        playBtn.textContent = "▶";
      }
    });

    nextBtn.addEventListener("click", () => playNext(false));
    prevBtn.addEventListener("click", playPrev);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active", isShuffle);
    });

    repeatBtn.addEventListener("click", () => {
      if (repeatMode === "all") {
        repeatMode = "one";
        repeatBtn.textContent = "🔂";
        repeatBtn.classList.add("active");
      } else if (repeatMode === "one") {
        repeatMode = "none";
        repeatBtn.textContent = "🔁";
        repeatBtn.classList.remove("active");
      } else {
        repeatMode = "all";
        repeatBtn.textContent = "🔁";
        repeatBtn.classList.add("active");
      }
    });

    document.querySelectorAll(".filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        sourceFilter = btn.dataset.source;
        renderTracks();
      });
    });

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      currentTab = "search";
      tabSearch.classList.add("active");
      tabFav.classList.remove("active");
      loadFeedOrSearch(q);
    });

    tabSearch.addEventListener("click", () => {
      currentTab = "search";
      tabSearch.classList.add("active");
      tabFav.classList.remove("active");
      renderTracks();
    });

    tabFav.addEventListener("click", () => {
      currentTab = "fav";
      tabFav.classList.add("active");
      tabSearch.classList.remove("active");
      statusLabel.textContent = `Избранное: ${favorites.length} треков`;
      renderTracks();
    });

    loadFeedOrSearch("");
  </script>
</body>
</html>
