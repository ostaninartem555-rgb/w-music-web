<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="W music" />
  <title>W music</title>
  <style>
    :root {
      --bg: #09090d;
      --surface: #13131b;
      --surface-2: #1c1c28;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --muted: #8e8ea0;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.35);
      --danger: #ff4d6d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 130px;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 13, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #00d4ff);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-box {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .status-text {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .track-item:active { transform: scale(0.99); }
    .track-item.playing {
      border-color: var(--accent);
      background: rgba(124, 92, 255, 0.12);
    }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--muted);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-duration {
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      padding: 6px;
      cursor: pointer;
    }
    .fav-btn.active { color: var(--danger); }

    /* Bottom Player */
    .player-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(19, 19, 27, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .player-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .time-label {
      font-size: 11px;
      color: var(--muted);
      width: 34px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 99px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .now-cover {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .now-meta { min-width: 0; }
    .now-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-artist {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .ctrl-btn.active { color: var(--accent); }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 15px;
    }

    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">W</div>
        <span>W music</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabSearch">Поиск</button>
        <button class="tab-btn" id="tabFav">Избранное (<span id="favCount">0</span>)</button>
      </div>
    </div>
    <form class="search-box" id="searchForm">
      <input type="text" class="search-input" id="searchInput" placeholder="Исполнитель или трек..." autocomplete="off" />
      <button type="submit" class="search-btn" id="searchBtn">Найти</button>
    </form>
  </header>

  <main>
    <div class="status-text">
      <span id="statusLabel">Популярные треки</span>
      <span id="queueInfo">Автопереключение: ВКЛ</span>
    </div>
    <div class="track-list" id="trackList"></div>
  </main>

  <div class="player-bar">
    <div class="player-inner">
      <div class="progress-wrap">
        <span class="time-label" id="curTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
        <span class="time-label" id="durTime">0:00</span>
      </div>
      <div class="player-controls-row">
        <div class="now-playing">
          <div class="now-cover" id="nowCover">🎵</div>
          <div class="now-meta">
            <div class="now-title" id="nowTitle">Выберите трек</div>
            <div class="now-artist" id="nowArtist">W music</div>
          </div>
        </div>
        <div class="buttons">
          <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">🔀</button>
          <button class="ctrl-btn" id="prevBtn" title="Назад">⏮</button>
          <button class="play-btn" id="playBtn" title="Пуск / Пауза">▶</button>
          <button class="ctrl-btn" id="nextBtn" title="Вперёд">⏭</button>
          <button class="ctrl-btn" id="repeatBtn" title="Повтор">🔁</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script>
    // Сервер по умолчанию для всех пользователей
    const SERVER_URL = "https://barrel-default-signatures-ict.trycloudflare.com";

    const audio = document.getElementById("audio");
    const trackListEl = document.getElementById("trackList");
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const statusLabel = document.getElementById("statusLabel");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const seekBar = document.getElementById("seekBar");
    const curTimeEl = document.getElementById("curTime");
    const durTimeEl = document.getElementById("durTime");
    const nowTitle = document.getElementById("nowTitle");
    const nowArtist = document.getElementById("nowArtist");
    const nowCover = document.getElementById("nowCover");
    const tabSearch = document.getElementById("tabSearch");
    const tabFav = document.getElementById("tabFav");
    const favCountEl = document.getElementById("favCount");

    let queue = [];
    let searchResults = [];
    let favorites = JSON.parse(localStorage.getItem("wmusic_favs") || "[]");
    let currentIndex = -1;
    let currentTab = "search";
    let isShuffle = false;
    let repeatMode = "all"; // "all" | "one" | "none"

    function updateFavCount() {
      favCountEl.textContent = favorites.length;
    }
    updateFavCount();

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function normalizeTrack(raw) {
      const id = raw.id || raw.trackId || raw.url || raw.streamUrl || Math.random().toString(36).slice(2);
      const title = raw.title || raw.name || "Без названия";
      const artist = raw.artist || raw.author || (raw.user && raw.user.username) || "Неизвестный исполнитель";
      const artwork = raw.artwork || raw.cover || raw.thumbnail || raw.image || "";
      let streamUrl = raw.streamUrl || raw.audioUrl || raw.url || "";
      if (streamUrl && streamUrl.startsWith("/")) {
        streamUrl = SERVER_URL + streamUrl;
      } else if (!streamUrl && raw.id) {
        streamUrl = `${SERVER_URL}/api/stream/${encodeURIComponent(raw.id)}`;
      }
      const duration = raw.duration ? (raw.duration > 10000 ? raw.duration / 1000 : raw.duration) : 0;
      return { id: String(id), title, artist, artwork, streamUrl, duration };
    }

    async function searchTracks(query) {
      statusLabel.innerHTML = `<span class="loader"></span> Ищем «${query}»...`;
      try {
        const endpoints = [
          `${SERVER_URL}/api/search?q=${encodeURIComponent(query)}`,
          `${SERVER_URL}/search?q=${encodeURIComponent(query)}`
        ];
        let data = null;
        for (const url of endpoints) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              data = await res.json();
              break;
            }
          } catch (_) {}
        }

        const list = Array.isArray(data) ? data : (data?.tracks || data?.results || data?.items || []);
        searchResults = list.map(normalizeTrack);
        if (currentTab === "search") {
          queue = searchResults;
          statusLabel.textContent = searchResults.length ? `Найдено треков: ${searchResults.length}` : "Ничего не найдено";
          renderTracks();
        }
      } catch (err) {
        statusLabel.textContent = "Ошибка соединения с сервером";
      }
    }

    function isFavorite(id) {
      return favorites.some(t => t.id === id);
    }

    function toggleFavorite(track, e) {
      e.stopPropagation();
      if (isFavorite(track.id)) {
        favorites = favorites.filter(t => t.id !== track.id);
      } else {
        favorites.unshift(track);
      }
      localStorage.setItem("wmusic_favs", JSON.stringify(favorites));
      updateFavCount();
      if (currentTab === "fav") {
        queue = favorites;
      }
      renderTracks();
    }

    function renderTracks() {
      const list = currentTab === "search" ? searchResults : favorites;
      if (!list.length) {
        trackListEl.innerHTML = `<div class="empty-state">${
          currentTab === "search" ? "Введите название трека или артиста в поиск сверху" : "В избранном пока пусто. Нажмите ♡ рядом с треком"
        }</div>`;
        return;
      }

      const activeTrack = queue[currentIndex];
      trackListEl.innerHTML = "";
      list.forEach((track, idx) => {
        const isPlaying = activeTrack && activeTrack.id === track.id;
        const item = document.createElement("div");
        item.className = "track-item" + (isPlaying ? " playing" : "");
        item.innerHTML = `
          ${track.artwork
            ? `<img class="track-cover" src="${track.artwork}" alt="" loading="lazy" />`
            : `<div class="track-cover">🎵</div>`}
          <div class="track-info">
            <div class="track-title">${escapeHtml(track.title)}</div>
            <div class="track-artist">${escapeHtml(track.artist)}</div>
          </div>
          ${track.duration ? `<span class="track-duration">${formatTime(track.duration)}</span>` : ""}
          <button class="fav-btn ${isFavorite(track.id) ? "active" : ""}" title="В избранное">
            ${isFavorite(track.id) ? "♥" : "♡"}
          </button>
        `;
        item.querySelector(".fav-btn").addEventListener("click", (e) => toggleFavorite(track, e));
        item.addEventListener("click", () => {
          queue = [...list];
          playTrackAt(idx);
        });
        trackListEl.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    async function playTrackAt(index) {
      if (index < 0 || index >= queue.length) return;
      currentIndex = index;
      const track = queue[currentIndex];

      nowTitle.textContent = track.title;
      nowArtist.textContent = track.artist;
      nowCover.innerHTML = track.artwork
        ? `<img src="${track.artwork}" style="width:100%;height:100%;border-radius:10px;object-fit:cover;" />`
        : "🎵";

      renderTracks();
      updateMediaSession(track);

      try {
        let src = track.streamUrl;
        // Если сервер отдает JSON с прямой ссылкой вместо аудиопотока
        if (src.includes("/api/stream/") || src.includes("/stream")) {
          audio.src = src;
        } else {
          audio.src = src;
        }
        await audio.play();
        playBtn.textContent = "⏸";
      } catch (err) {
        console.warn("Playback error, skipping...", err);
        setTimeout(() => playNext(true), 800);
      }
    }

    function playNext(auto = false) {
      if (!queue.length) return;
      if (auto && repeatMode === "one") {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      if (isShuffle && queue.length > 1) {
        let nextIdx;
        do {
          nextIdx = Math.floor(Math.random() * queue.length);
        } while (nextIdx === currentIndex);
        playTrackAt(nextIdx);
        return;
      }
      if (currentIndex + 1 < queue.length) {
        playTrackAt(currentIndex + 1);
      } else if (repeatMode === "all" || !auto) {
        playTrackAt(0);
      } else {
        playBtn.textContent = "▶";
      }
    }

    function playPrev() {
      if (!queue.length) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      const prevIdx = currentIndex - 1 >= 0 ? currentIndex - 1 : queue.length - 1;
      playTrackAt(prevIdx);
    }

    function updateMediaSession(track) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "W music",
          artwork: track.artwork ? [{ src: track.artwork, sizes: "512x512", type: "image/jpeg" }] : []
        });
        navigator.mediaSession.setActionHandler("play", () => { audio.play(); playBtn.textContent = "⏸"; });
        navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); playBtn.textContent = "▶"; });
        navigator.mediaSession.setActionHandler("previoustrack", playPrev);
        navigator.mediaSession.setActionHandler("nexttrack", () => playNext(false));
      }
    }

    // Автопереключение при окончании трека
    audio.addEventListener("ended", () => playNext(true));

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        curTimeEl.textContent = formatTime(audio.currentTime);
        durTimeEl.textContent = formatTime(audio.duration);
      }
    });

    seekBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    playBtn.addEventListener("click", () => {
      if (!audio.src && queue.length) {
        playTrackAt(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "⏸";
      } else {
        audio.pause();
        playBtn.textContent = "▶";
      }
    });

    nextBtn.addEventListener("click", () => playNext(false));
    prevBtn.addEventListener("click", playPrev);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active", isShuffle);
    });

    repeatBtn.addEventListener("click", () => {
      if (repeatMode === "all") {
        repeatMode = "one";
        repeatBtn.textContent = "🔂";
        repeatBtn.classList.add("active");
      } else if (repeatMode === "one") {
        repeatMode = "none";
        repeatBtn.textContent = "🔁";
        repeatBtn.classList.remove("active");
      } else {
        repeatMode = "all";
        repeatBtn.textContent = "🔁";
        repeatBtn.classList.add("active");
      }
    });
    repeatBtn.classList.add("active");

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;
      currentTab = "search";
      tabSearch.classList.add("active");
      tabFav.classList.remove("active");
      searchTracks(q);
    });

    tabSearch.addEventListener("click", () => {
      currentTab = "search";
      tabSearch.classList.add("active");
      tabFav.classList.remove("active");
      statusLabel.textContent = searchResults.length ? `Найдено треков: ${searchResults.length}` : "Поиск музыки";
      renderTracks();
    });

    tabFav.addEventListener("click", () => {
      currentTab = "fav";
      tabFav.classList.add("active");
      tabSearch.classList.remove("active");
      statusLabel.textContent = `Избранные треки: ${favorites.length}`;
      renderTracks();
    });

    // Стартовый поиск при открытии
    searchTracks("Phonk");
  </script>
</body>
</html>
